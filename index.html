<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZolTube</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#111;
}

header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 14px;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:27px;
  font-weight:800;
  color:#e11;
  white-space:nowrap;
}

.logo span{
  color:#111;
}

.search{
  flex:1;
  display:flex;
  max-width:650px;
  margin:auto;
}

.search input{
  width:100%;
  padding:12px 16px;
  border:1px solid #bbb;
  border-radius:24px 0 0 24px;
  font-size:16px;
  outline:none;
}

.search button{
  border:1px solid #bbb;
  border-left:0;
  border-radius:0 24px 24px 0;
  background:#fff;
  padding:0 18px;
  font-size:20px;
  cursor:pointer;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#111;
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:bold;
  cursor:pointer;
}

.layout{
  display:flex;
}

.side{
  width:210px;
  background:#fff;
  min-height:calc(100vh - 64px);
  padding:14px 9px;
  position:sticky;
  top:64px;
}

.nav{
  padding:13px;
  border-radius:10px;
  cursor:pointer;
  margin:3px 0;
}

.nav:hover,
.nav.active{
  background:#eee;
  font-weight:bold;
}

main{
  flex:1;
  max-width:1250px;
  margin:auto;
  padding:20px;
}

.row{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.btn{
  padding:11px 17px;
  border:0;
  border-radius:22px;
  font-size:15px;
  cursor:pointer;
}

.primary{
  background:#e11;
  color:#fff;
}

.secondary{
  background:#fff;
  border:1px solid #bbb;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(245px,1fr));
  gap:20px;
}

.card{
  cursor:pointer;
}

.thumb{
  aspect-ratio:16/9;
  border-radius:10px;
  background:linear-gradient(135deg,#222,#888);
  display:grid;
  place-items:center;
  color:#fff;
  font-size:42px;
  overflow:hidden;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.title{
  font-weight:700;
  margin-top:9px;
}

.meta{
  font-size:13px;
  color:#666;
  margin-top:5px;
}

.panel{
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  padding:20px;
  margin-bottom:18px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:30;
  align-items:center;
  justify-content:center;
  padding:18px;
}

.box{
  background:#fff;
  padding:22px;
  border-radius:16px;
  width:100%;
  max-width:520px;
  max-height:90vh;
  overflow:auto;
}

.box input,
.box textarea{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #bbb;
  border-radius:8px;
  font-size:15px;
}

.box textarea{
  min-height:100px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat{
  background:#eee;
  padding:16px;
  border-radius:12px;
}

.stat b{
  display:block;
  font-size:25px;
  margin-top:5px;
}

video.player{
  width:100%;
  max-height:65vh;
  background:#000;
  border-radius:10px;
}

.error{
  border:2px solid #e11;
}

.small{
  font-size:13px;
  color:#666;
}

@media(max-width:750px){
  .side{
    display:none;
  }

  main{
    padding:14px;
  }

  .grid{
    grid-template-columns:1fr 1fr;
  }

  .logo{
    font-size:23px;
  }
}

@media(max-width:430px){
  .grid{
    grid-template-columns:1fr;
  }

  .search input{
    font-size:14px;
  }
}
</style>

<script>

/* =====================================================
   SUPABASE CONNECTION
   ===================================================== */

const SUPABASE_URL =
"https://yfcvfcokdovppmwldrl.supabase.co";


/*
   IMPORTANT:
   नीचे अपनी वही Supabase PUBLISHABLE KEY डालना।

   Service Role / Secret Key मत डालना।
*/

sb_publishable_XTbCx24neg0ySUi6Ih16hw_ordpBVhf

const supabase =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   GLOBAL VARIABLES
   ===================================================== */

let vids = [];

let me = null;

let currentUser = null;

let loading = true;


const main =
document.getElementById("main");

const modal =
document.getElementById("modal");

const box =
document.getElementById("box");

const ava =
document.getElementById("ava");


/* =====================================================
   HELPERS
   ===================================================== */

function esc(s){

  return String(s ?? "")
  .replace(/[&<>"]/g,c=>({

    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;"

  }[c]));

}


function wait(ms){

  return new Promise(resolve =>
    setTimeout(resolve,ms)
  );

}


/*
  किसी Supabase request के हमेशा loading में फँसने से
  बचाने के लिए timeout.
*/

async function withTimeout(
  promise,
  ms=10000
){

  let timer;

  const timeout =
    new Promise((_,reject)=>{

      timer=setTimeout(()=>{

        reject(
          new Error(
            "Supabase connection timed out. Internet या Supabase settings check करें."
          )
        );

      },ms);

    });


  try{

    return await Promise.race([
      promise,
      timeout
    ]);

  }finally{

    clearTimeout(timer);

  }

}


/* =====================================================
   AUTH / PROFILE
   ===================================================== */

async function loadMe(){

  try{

    const result =
      await withTimeout(
        supabase.auth.getSession(),
        10000
      );

    const session =
      result.data?.session || null;

    currentUser =
      session?.user || null;


    if(!currentUser){

      me=null;

      ava.textContent="Z";

      return null;

    }


    const profileResult =
      await withTimeout(

        supabase
        .from("profiles")
        .select(
          "id,username,display_name,avatar_url"
        )
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle(),

        10000

      );


    if(profileResult.error){

      console.log(
        "Profile error:",
        profileResult.error
      );

      me={

        id:currentUser.id,

        username:
          currentUser.email
          ? currentUser.email.split("@")[0]
          : "user",

        display_name:
          currentUser.email
          ? currentUser.email.split("@")[0]
          : "ZolTube"

      };

    }else{

      me =
        profileResult.data;

    }


    ava.textContent =
      (
        me?.display_name ||
        me?.username ||
        "Z"
      )[0].toUpperCase();


    return me;


  }catch(error){

    console.log(
      "loadMe error:",
      error
    );

    currentUser=null;

    me=null;

    ava.textContent="Z";

    return null;

  }

}


/* =====================================================
   LOAD VIDEOS
   ===================================================== */

async function load(){

  loading=true;

  main.innerHTML=`

    <div class="panel">

      <h2>ZolTube</h2>

      <p>
        Loading videos...
      </p>

    </div>

  `;


  try{

    const result =
      await withTimeout(

        supabase
        .from("videos")
        .select(`
          id,
          user_id,
          title,
          description,
          video_url,
          thumbnail_url,
          views,
          likes,
          created_at
        `)
        .order(
          "created_at",
          {
            ascending:false
          }
        ),

        10000

      );


    if(result.error){

      throw result.error;

    }


    vids =
      result.data || [];


    loading=false;

    renderHome();


  }catch(error){

    console.error(
      "VIDEO LOAD ERROR:",
      error
    );

    loading=false;


    main.innerHTML=`

      <div class="panel error">

        <h2>
          ⚠️ ZolTube Error
        </h2>

        <p>
          Videos load नहीं हो पाए।
        </p>

        <p>
          ${esc(error.message)}
        </p>

        <button
          class="btn primary"
          onclick="load()"
        >
          🔄 Retry
        </button>

      </div>

    `;

  }

}


/* =====================================================
   VIDEO CARD
   ===================================================== */

function card(v){

  const thumb =
    v.thumbnail_url
    ? `<img src="${esc(v.thumbnail_url)}">`
    : "▶";


  return `

    <div
      class="card"
      onclick='watch(${JSON.stringify(v.id)})'
    >

      <div class="thumb">
        ${thumb}
      </div>

      <div class="title">
        ${esc(v.title)}
      </div>

      <div class="meta">

        ${Number(v.views || 0)}
        views

        ·

        ${new Date(
          v.created_at
        ).toLocaleDateString("en-IN")}

      </div>

    </div>

  `;

}


/* =====================================================
   HOME
   ===================================================== */

function renderHome(){

  if(loading){

    return;

  }


  const input =
    document.getElementById("q");

  const q =
    (
      input?.value || ""
    ).toLowerCase()
     .trim();


  let list=[...vids];


  if(q){

    list =
      list.filter(v =>

        (
          v.title +
          " " +
          (v.description || "")
        )
        .toLowerCase()
        .includes(q)

      );

  }


  main.innerHTML=`

    <div
      class="row"
      style="margin-bottom:18px"
    >

      <button
        class="btn primary"
        onclick="uploadBox()"
      >
        ⬆️ Upload video
      </button>

      <button
        class="btn secondary"
        onclick="accountBox()"
      >
        ${me ? "👤 Account" : "🔐 Login / Sign up"}
      </button>

    </div>


    ${
      list.length

      ?

      `<div class="grid">
        ${list.map(card).join("")}
       </div>`

      :

      `
      <div class="panel">

        <h2>
          अभी कोई video नहीं है।
        </h2>

        <p>
          पहला video upload करके testing शुरू करें।
        </p>

      </div>
      `
    }

  `;

}


/* =====================================================
   HOME NAV
   ===================================================== */

function home(el){

  nav(el);

  renderHome();

}


/* =====================================================
   NAVIGATION
   ===================================================== */

function nav(el){

  document
  .querySelectorAll(".nav")
  .forEach(x =>
    x.classList.remove("active")
  );


  if(el){

    el.classList.add("active");

  }

}


/* =====================================================
   SHORTS
   ===================================================== */

function shorts(el){

  nav(el);


  const list =
    vids.filter(v =>

      String(v.title)
      .toLowerCase()
      .includes("short")

    );


  main.innerHTML=`

    <div class="panel">

      <h2>⚡ Shorts</h2>

      ${
        list.length

        ?

        `<div class="grid">
          ${list.map(card).join("")}
         </div>`

        :

        `<p>
          अभी Shorts नहीं हैं।
         </p>`

      }

    </div>

  `;

}


/* =====================================================
   LOGIN / SIGNUP BOX
   ===================================================== */

function loginBox(){

  modal.style.display="flex";


  box.innerHTML=`

    <h2>
      🔐 ZolTube Account
    </h2>

    <p class="small">
      नया account बनाने के लिए नीचे जानकारी भरें।
    </p>

    <input
      id="n"
      placeholder="Name"
    >

    <input
      id="e"
      type="email"
      placeholder="Email"
    >

    <input
      id="p"
      type="password"
      placeholder="Password (6+ characters)"
    >

    <div class="row">

      <button
        class="btn primary"
        onclick="signup()"
      >
        Create account
      </button>

      <button
        class="btn secondary"
        onclick="signin()"
      >
        Login
      </button>

      <button
        class="btn secondary"
        onclick="closeBox()"
      >
        Close
      </button>

    </div>

  `;

}


/* =====================================================
   SIGN UP
   ===================================================== */

async function signup(){

  const name =
    document.getElementById("n")
    .value.trim();

  const email =
    document.getElementById("e")
    .value.trim();

  const password =
    document.getElementById("p")
    .value;


  if(!name){

    alert("Name डालें");

    return;

  }


  if(!email){

    alert("Email डालें");

    return;

  }


  if(password.length < 6){

    alert(
      "Password कम से कम 6 characters का होना चाहिए."
    );

    return;

  }


  try{

    const result =
      await withTimeout(

        supabase.auth.signUp({

          email,
          password,

          options:{
            data:{
              display_name:name,
              username:
                name
                .toLowerCase()
                .replace(/[^a-z0-9]/g,"")
                .slice(0,30)
            }
          }

        }),

        15000

      );


    if(result.error){

      throw result.error;

    }


    /*
      Email confirmation ON होने पर session तुरंत
      नहीं भी मिल सकता।
    */

    if(!result.data.session){

      closeBox();

      alert(
        "Account बन गया है। अगर email confirmation मांगा जाए तो अपनी email में जाकर confirmation पूरा करें, फिर ZolTube में Login करें."
      );

      return;

    }


    await createProfile(
      result.data.user,
      name
    );


    await loadMe();

    closeBox();

    renderHome();


  }catch(error){

    alert(
      "Signup error: " +
      error.message
    );

  }

}


/* =====================================================
   CREATE PROFILE
   ===================================================== */

async function createProfile(
  user,
  name
){

  if(!user){

    return;

  }


  const username =
    name
    .toLowerCase()
    .replace(/[^a-z0-9]/g,"")
    .slice(0,30)
    ||
    "user" +
    user.id.slice(0,8);


  const result =
    await supabase
    .from("profiles")
    .upsert({

      id:user.id,

      username:username,

      display_name:name,

      avatar_url:null

    });


  if(result.error){

    console.log(
      "Profile create error:",
      result.error
    );

  }

}


/* =====================================================
   LOGIN
   ===================================================== */

async function signin(){

  const email =
    document.getElementById("e")
    .value.trim();

  const password =
    document.getElementById("p")
    .value;


  if(!email || !password){

    alert(
      "Email और password डालें."
    );

    return;

  }


  try{

    const result =
      await withTimeout(

        supabase.auth.signInWithPassword({

          email,
          password

        }),

        15000

      );


    if(result.error){

      throw result.error;

    }


    await loadMe();

    closeBox();

    renderHome();


  }catch(error){

    alert(
      "Login error: " +
      error.message
    );

  }

}


/* =====================================================
   ACCOUNT
   ===================================================== */

function accountBox(){

  modal.style.display="flex";


  if(!me){

    box.innerHTML=`

      <h2>
        🔐 ZolTube Account
      </h2>

      <p>
        आप अभी login नहीं हैं।
      </p>

      <button
        class="btn primary"
        onclick="loginBox()"
      >
        Login / Sign up
      </button>

      <button
        class="btn secondary"
        onclick="closeBox()"
      >
        Close
      </button>

    `;

    return;

  }


  box.innerHTML=`

    <h2>
      👤 ${esc(me.display_name || me.username)}
    </h2>

    <p>
      Username:
      ${esc(me.username || "")}
    </p>

    <p class="small">
      ${esc(currentUser?.email || "")}
    </p>

    <div class="row">

      <button
        class="btn secondary"
        onclick="channel()"
      >
        My Channel
      </button>

      <button
        class="btn secondary"
        onclick="studio()"
      >
        Creator Studio
      </button>

      <button
        class="btn primary"
        onclick="logout()"
      >
        Logout
      </button>

      <button
        class="btn secondary"
        onclick="closeBox()"
      >
        Close
      </button>

    </div>

  `;

}


/* =====================================================
   LOGOUT
   ===================================================== */

async function logout(){

  try{

    await supabase.auth.signOut();

    me=null;

    currentUser=null;

    ava.textContent="Z";

    closeBox();

    renderHome();

  }catch(error){

    alert(
      "Logout error: " +
      error.message
    );

  }

}


/* =====================================================
   UPLOAD BOX
   ===================================================== */

async function uploadBox(){

  if(!currentUser){

    loginBox();

    return;

  }


  modal.style.display="flex";


  box.innerHTML=`

    <h2>
      ⬆️ Upload Video
    </h2>

    <input
      id="t"
      placeholder="Video title"
    >

    <textarea
      id="d"
      placeholder="Description"
    ></textarea>

    <input
      id="f"
      type="file"
      accept="video/*"
    >

    <p class="small">
      Maximum file size: 50 MB
    </p>

    <div class="row">

      <button
        class="btn primary"
        onclick="publish()"
      >
        Publish
      </button>

      <button
        class="btn secondary"
        onclick="closeBox()"
      >
        Cancel
      </button>

    </div>

  `;

}


/* =====================================================
   PUBLISH VIDEO
   ===================================================== */

async function publish(){

  const title =
    document.getElementById("t")
    .value.trim();

  const description =
    document.getElementById("d")
    .value.trim();

  const file =
    document.getElementById("f")
    .files[0];


  if(!title){

    alert(
      "Video title डालें."
    );

    return;

  }


  if(!file){

    alert(
      "पहले video select करें."
    );

    return;

  }


  if(
    !file.type.startsWith("video/")
  ){

    alert(
      "केवल video file upload करें."
    );

    return;

  }


  if(
    file.size > 50 * 1024 * 1024
  ){

    alert(
      "Video 50 MB से छोटा होना चाहिए."
    );

    return;

  }


  try{

    box.innerHTML=`

      <h2>
        ⏳ Uploading...
      </h2>

      <p>
        Video upload हो रहा है।
        इस दौरान page बंद न करें।
      </p>

    `;


    const safeName =
      file.name
      .replace(/[^a-zA-Z0-9._-]/g,"_");


    const filePath =
      currentUser.id +
      "/" +
      Date.now() +
      "-" +
      safeName;


    const uploadResult =
      await withTimeout(

        supabase
        .storage
        .from("videos")
        .upload(
          filePath,
          file,
          {
            cacheControl:"360
