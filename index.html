<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZolTube V3</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f7f7f7;color:#111}header{height:60px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:12px;padding:8px 14px;position:sticky;top:0;z-index:4}.logo{font-size:24px;font-weight:800;color:#e11}.logo span{color:#111}.search{flex:1;max-width:650px;margin:auto;display:flex}.search input{width:100%;padding:11px 15px;border:1px solid #bbb;border-radius:22px 0 0 22px}.search button{border:1px solid #bbb;border-left:0;border-radius:0 22px 22px 0;padding:0 18px}.avatar{width:36px;height:36px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:bold}.layout{display:flex}.side{width:210px;background:#fff;min-height:calc(100vh - 60px);padding:14px 9px;position:sticky;top:60px}.nav{padding:12px;border-radius:10px;cursor:pointer;margin:3px 0}.nav:hover,.nav.active{background:#eee;font-weight:bold}main{flex:1;max-width:1250px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:20px}.card{cursor:pointer}.thumb{aspect-ratio:16/9;border-radius:10px;background:linear-gradient(135deg,#222,#888);display:grid;place-items:center;color:white;font-size:40px}.title{font-weight:700;margin-top:9px}.meta{font-size:13px;color:#666;margin-top:5px}.panel{background:#fff;border:1px solid #ddd;border-radius:14px;padding:20px;margin-bottom:18px}.btn{padding:10px 16px;border:0;border-radius:22px;cursor:pointer}.primary{background:#e11;color:#fff}.secondary{background:#fff;border:1px solid #bbb}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center;padding:18px}.box{background:#fff;padding:22px;border-radius:16px;width:100%;max-width:520px}.box input,.box textarea{width:100%;padding:11px;margin:7px 0;border:1px solid #bbb;border-radius:8px}.row{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#eee;padding:16px;border-radius:12px}.stat b{display:block;font-size:25px;margin-top:5px}@media(max-width:750px){.side{display:none}main{padding:14px}.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="logo">Zol<span>Tube</span></div><div class="search"><input id="q" placeholder="Search ZolTube..." oninput="render()"><button>🔍</button></div><div class="avatar" id="ava">Z</div></header>
<div class="layout"><aside class="side"><div class="nav active" onclick="home(this)">🏠 Home</div><div class="nav" onclick="showShorts(this)">⚡ Shorts</div><hr><div class="nav" onclick="studio(this)">📊 Creator Studio</div><div class="nav" onclick="uploadBox()">⬆️ Upload</div><div class="nav" onclick="channel(this)">👤 My Channel</div><div class="nav" onclick="loginBox()">🔐 Login</div></aside><main id="main"></main></div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<script>
let vids=[], mode="home", token=localStorage.zolToken||"", me=JSON.parse(localStorage.zolMe||"null");
const main=document.getElementById("main");
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})};let r=await fetch(url,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
async function load(){try{vids=await api("/api/videos")}catch(e){vids=[]}render()}
function card(v){return `<div class="card" onclick="watch(${v.id})"><div class="thumb">▶</div><div class="title">${esc(v.title)}</div><div class="meta">${esc(v.channel)} · ${v.views} views</div></div>`}
function render(){let list=[...vids],q=document.getElementById("q").value.toLowerCase();if(mode==="shorts")list=list.filter(v=>v.title.toLowerCase().includes("short"));if(q)list=list.filter(v=>(v.title+" "+v.channel).toLowerCase().includes(q));main.innerHTML=`<div class="row" style="margin-bottom:18px"><button class="btn primary" onclick="uploadBox()">⬆️ Upload video</button><button class="btn secondary" onclick="loginBox()">${me?"Account":"Login / Sign up"}</button></div><div class="grid">${list.map(card).join("")||"<div class='panel'>अभी कोई video नहीं है। पहला video upload करें।</div>"}</div>`}
function home(el){mode="home";nav(el);render()}function showShorts(el){mode="shorts";nav(el);render()}function nav(el){document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));el?.classList.add("active")}
function loginBox(){document.getElementById("modal").style.display="flex";document.getElementById("box").innerHTML=`<h2>🔐 ZolTube Account</h2><input id="n" placeholder="Name (signup के लिए)"><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password (6+ characters)"><div class="row"><button class="btn primary" onclick="signup()">Create account</button><button class="btn secondary" onclick="signin()">Login</button><button class="btn secondary" onclick="closeBox()">Close</button></div>`}
async function signup(){try{let d=await api("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n.value,email:e.value,password:p.value})});setMe(d);closeBox();render()}catch(x){alert(x.message)}}
async function signin(){try{let d=await api("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:e.value,password:p.value})});setMe(d);closeBox();render()}catch(x){alert(x.message)}}
function setMe(d){token=d.token;me=d.user;localStorage.zolToken=token;localStorage.zolMe=JSON.stringify(me);ava.textContent=me.name[0].toUpperCase()}
function uploadBox(){if(!token)return loginBox();document.getElementById("modal").style.display="flex";document.getElementById("box").innerHTML=`<h2>⬆️ Upload Video</h2><input id="t" placeholder="Video title"><textarea id="d" placeholder="Description"></textarea><input id="f" type="file" accept="video/*"><p>Production note: server अभी local disk पर video रखता है; public launch से पहले cloud storage लगाना जरूरी है।</p><div class="row"><button class="btn primary" onclick="publish()">Publish</button><button class="btn secondary" onclick="closeBox()">Cancel</button></div>`}
async function publish(){try{let fd=new FormData();fd.append("title",t.value);fd.append("description",d.value);fd.append("video",f.files[0]);await api("/api/videos",{method:"POST",body:fd});closeBox();await load();alert("Video uploaded!")}catch(x){alert(x.message)}}
async function watch(id){let v=vids.find(x=>x.id===id);await api("/api/videos/"+id+"/view",{method:"POST"}).catch(()=>{});main.innerHTML=`<div class="panel"><video controls style="width:100%;max-height:65vh;background:#000" src="/api/videos/${id}/stream"></video><h2>${esc(v.title)}</h2><div class="meta">${esc(v.channel)} · ${v.views+1} views</div><p>${esc(v.description||"")}</p><div class="row"><button class="btn secondary">👍 Like</button><button class="btn secondary">💬 Comment</button><button class="btn primary">🔔 Subscribe</button></div></div>`}
function studio(el){nav(el);let mine=vids.filter(v=>me&&v.name===me.name);let views=mine.reduce((a,v)=>a+v.views,0);main.innerHTML=`<div class="panel"><h1>📊 Creator Studio</h1><p>${me?"Welcome, "+esc(me.name):"Login करके अपना dashboard देखें।"}</p><div class="stats"><div class="stat">Videos<b>${mine.length}</b></div><div class="stat">Views<b>${views}</b></div><div class="stat">Subscribers<b>0</b></div></div></div>`}
function channel(el){nav(el);if(!me){loginBox();return}let mine=vids.filter(v=>v.channel===me.channel);main.innerHTML=`<div class="panel"><h1>👤 ${esc(me.channel)}</h1><p>${esc(me.email)}</p><h2>My Videos</h2><div class="grid">${mine.map(card).join("")||"अभी videos नहीं हैं।"}</div></div>`}
function closeBox(){modal.style.display="none"}function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
load();
</script></body></html>
