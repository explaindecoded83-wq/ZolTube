<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZolTube</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f7f7f7;color:#111}
header{height:60px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:12px;padding:8px 14px;position:sticky;top:0;z-index:4}
.logo{font-size:24px;font-weight:800;color:#e11}
.logo span{color:#111}
.search{flex:1;max-width:650px;margin:auto;display:flex}
.search input{width:100%;padding:11px 15px;border:1px solid #bbb;border-radius:22px 0 0 22px}
.search button{border:1px solid #bbb;border-left:0;border-radius:0 22px 22px 0;padding:0 18px}
.avatar{width:36px;height:36px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-weight:bold}
.layout{display:flex}
.side{width:210px;background:#fff;min-height:calc(100vh - 60px);padding:14px 9px;position:sticky;top:60px}
.nav{padding:12px;border-radius:10px;cursor:pointer;margin:3px 0}
.nav:hover,.nav.active{background:#eee;font-weight:bold}
main{flex:1;max-width:1250px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:20px}
.card{cursor:pointer}
.thumb{aspect-ratio:16/9;border-radius:10px;background:linear-gradient(135deg,#222,#888);display:grid;place-items:center;color:white;font-size:40px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.title{font-weight:700;margin-top:9px}
.meta{font-size:13px;color:#666;margin-top:5px}
.panel{background:#fff;border:1px solid #ddd;border-radius:14px;padding:20px;margin-bottom:18px}
.btn{padding:10px 16px;border:0;border-radius:22px;cursor:pointer}
.primary{background:#e11;color:#fff}
.secondary{background:#fff;border:1px solid #bbb}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:center;justify-content:center;padding:18px}
.box{background:#fff;padding:22px;border-radius:16px;width:100%;max-width:520px}
.box input,.box textarea{width:100%;padding:11px;margin:7px 0;border:1px solid #bbb;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:#eee;padding:16px;border-radius:12px}
.stat b{display:block;font-size:25px;margin-top:5px}
video{width:100%;max-height:65vh;background:#000;border-radius:10px}
@media(max-width:750px){
.side{display:none}
main{padding:14px}
.stats{grid-template-columns:1fr}
.grid{grid-template-columns:1fr 1fr}
}
@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header>
<div class="logo">Zol<span>Tube</span></div>
<div class="search">
<input id="q" placeholder="Search ZolTube..." oninput="render()">
<button onclick="render()">🔍</button>
</div>
<div class="avatar" id="ava">Z</div>
</header>

<div class="layout">

<aside class="side">
<div class="nav active" onclick="home(this)">🏠 Home</div>
<div class="nav" onclick="showShorts(this)">⚡ Shorts</div>
<hr>
<div class="nav" onclick="studio(this)">📊 Creator Studio</div>
<div class="nav" onclick="uploadBox()">⬆️ Upload</div>
<div class="nav" onclick="channel(this)">👤 My Channel</div>
<div class="nav" onclick="loginBox()">🔐 Account</div>
</aside>

<main id="main"></main>

</div>

<div class="modal" id="modal">
<div class="box" id="box"></div>
</div>

<script>

/* =========================
   SUPABASE CONNECTION
========================= */

const SUPABASE_URL =
"https://yfcvfcokdovppmwldrl.supabase.co";

sb_publishable_XTbCx24neg0ySUi6Ih16hw_ordpBVhf

const supabase =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


/* =========================
   APP DATA
========================= */

let vids=[];
let mode="home";
let me=null;

const main=document.getElementById("main");
const modal=document.getElementById("modal");
const box=document.getElementById("box");
const ava=document.getElementById("ava");


/* =========================
   CURRENT USER
========================= */

async function loadMe(){

const {data:{user}} =
await supabase.auth.getUser();

if(!user){
me=null;
ava.textContent="Z";
return;
}

const {data:profile} =
await supabase
.from("profiles")
.select("*")
.eq("id",user.id)
.maybeSingle();

me={
id:user.id,
email:user.email,
name:profile?.display_name ||
user.user_metadata?.display_name ||
"Zol Rao",
channel:
(profile?.display_name ||
user.user_metadata?.display_name ||
"Zol Rao")+" Channel"
};

ava.textContent=
me.name.charAt(0).toUpperCase();
}


/* =========================
   LOAD VIDEOS
========================= */

async function load(){

const {data,error} =
await supabase
.from("videos")
.select("*")
.order("created_at",{ascending:false});

if(error){
console.log(error);
vids=[];
render();
return;
}

vids=data||[];

const ids=[
...new Set(vids.map(v=>v.user_id))
];

if(ids.length){

const {data:profiles} =
await supabase
.from("profiles")
.select("id,display_name,avatar_url")
.in("id",ids);

const map={};

(profiles||[]).forEach(p=>{
map[p.id]=p;
});

vids=vids.map(v=>({
...v,
name:map[v.user_id]?.display_name||"ZolTube Creator",
channel:
(map[v.user_id]?.display_name||"ZolTube Creator")+" Channel"
}));

}

render();
}


/* =========================
   HOME
========================= */

function home(el){
mode="home";
nav(el);
render();
}

function showShorts(el){
mode="shorts";
nav(el);
render();
}

function nav(el){
document
.querySelectorAll(".nav")
.forEach(x=>x.classList.remove("active"));

if(el)el.classList.add("active");
}


/* =========================
   VIDEO CARD
========================= */

function card(v){

return `
<div class="card"
onclick='watch(${JSON.stringify(v.id)})'>

<div class="thumb">
${v.thumbnail_url
?`<img src="${esc(v.thumbnail_url)}">`
:"▶"}
</div>

<div class="title">
${esc(v.title)}
</div>

<div class="meta">
${esc(v.channel||"ZolTube Creator")}
 · ${v.views||0} views
</div>

</div>
`;
}


/* =========================
   RENDER
========================= */

function render(){

let list=[...vids];

const q=
(document.getElementById("q").value||"")
.toLowerCase();

if(mode==="shorts"){
list=list.filter(v=>
(v.title||"").toLowerCase().includes("short")
);
}

if(q){

list=list.filter(v=>
(
(v.title||"")+" "+
(v.channel||"")
)
.toLowerCase()
.includes(q)
);

}

main.innerHTML=`

<div class="row" style="margin-bottom:18px">

<button class="btn primary"
onclick="uploadBox()">
⬆️ Upload video
</button>

<button class="btn secondary"
onclick="loginBox()">
${me?"Account":"Login / Sign up"}
</button>

</div>

<div class="grid">

${
list.map(card).join("")
||
"<div class='panel'>अभी कोई video नहीं है। पहला video upload करें।</div>"
}

</div>
`;
}


/* =========================
   ACCOUNT
========================= */

function loginBox(){

modal.style.display="flex";

box.innerHTML=`

<h2>🔐 ZolTube Account</h2>

<input id="n"
placeholder="Name (signup के लिए)">

<input id="e"
type="email"
placeholder="Email">

<input id="p"
type="password"
placeholder="Password (6+ characters)">

<div class="row">

<button class="btn primary"
onclick="signup()">
Create account
</button>

<button class="btn secondary"
onclick="signin()">
Login
</button>

${
me
?`<button class="btn secondary"
onclick="logout()">
Logout
</button>`
:""
}

<button class="btn secondary"
onclick="closeBox()">
Close
</button>

</div>
`;
}


/* =========================
   SIGN UP
========================= */

async function signup(){

try{

const name=
(document.getElementById("n").value||"").trim();

const email=
(document.getElementById("e").value||"").trim();

const password=
document.getElementById("p").value;

if(!name||!email||password.length<6){

alert("Name, email और 6+ character password डालें।");
return;
}

const {data,error}=
await supabase.auth.signUp({

email,
password,

options:{
data:{
display_name:name
}
}

});

if(error)throw error;

if(data.user){

const username=
name.toLowerCase()
.replace(/[^a-z0-9]/g,"")
.slice(0,25)
+"_"+data.user.id.slice(0,6);

await supabase
.from("profiles")
.upsert({
id:data.user.id,
username,
display_name:name
});

}

if(!data.session){

alert(
"Account बन गया ✅\n\nअगर email confirmation चालू है तो पहले अपनी email verify करें, फिर Login करें।"
);

}else{

await loadMe();
closeBox();
render();

}

}catch(e){

alert(e.message);

}

}


/* =========================
   LOGIN
========================= */

async function signin(){

try{

const email=
(document.getElementById("e").value||"").trim();

const password=
document.getElementById("p").value;

const {error}=
await supabase.auth.signInWithPassword({
email,
password
});

if(error)throw error;

await loadMe();

closeBox();

render();

}catch(e){

alert(e.message);

}

}


/* =========================
   LOGOUT
========================= */

async function logout(){

await supabase.auth.signOut();

me=null;
ava.textContent="Z";

closeBox();
render();

}


/* =========================
   UPLOAD
========================= */

function uploadBox(){

if(!me){

loginBox();
return;

}

modal.style.display="flex";

box.innerHTML=`

<h2>⬆️ Upload Video</h2>

<input id="t"
placeholder="Video title">

<textarea id="d"
placeholder="Description"></textarea>

<input id="f"
type="file"
accept="video/*">

<p>
Free Supabase storage में file size limit हो सकती है।
अभी छोटा test video upload करें।
</p>

<div class="row">

<button class="btn primary"
onclick="publish()">
Publish
</button>

<button class="btn secondary"
onclick="closeBox()">
Cancel
</button>

</div>
`;
}


/* =========================
   PUBLISH VIDEO
========================= */

async function publish(){

try{

const title=
(document.getElementById("t").value||"").trim();

const description=
(document.getElementById("d").value||"").trim();

const file=
document.getElementById("f").files[0];

if(!title){

alert("Video title डालें।");
return;

}

if(!file){

alert("Video file चुनें।");
return;

}

if(!file.type.startsWith("video/")){

alert("सिर्फ video file upload करें।");
return;

}

const safeName=
file.name
.replace(/[^a-zA-Z0-9._-]/g,"_");

const path=
me.id+
"/"+
Date.now()+
"_"+safeName;


/* Upload to Supabase Storage */

const {error:uploadError}=
await supabase
.storage
.from("videos")
.upload(path,file,{
contentType:file.type,
upsert:false
});

if(uploadError)throw uploadError;


/* Public URL */

const {data:urlData}=
supabase
.storage
.from("videos")
.getPublicUrl(path);


/* Save video information */

const {error:dbError}=
await supabase
.from("videos")
.insert({

user_id:me.id,
title,
description,
video_url:urlData.publicUrl,
views:0,
likes:0

});

if(dbError)throw dbError;

closeBox();

await load();

alert("Video uploaded successfully! ✅");

}catch(e){

alert("Upload error: "+e.message);

}

}


/* =========================
   WATCH
========================= */

async function watch(id){

const v=
vids.find(x=>String(x.id)===String(id));

if(!v)return;


/* Increase view */

await supabase
.rpc("increment_video_views",{
p_video_id:id
})
.catch(()=>{});


main.innerHTML=`

<div class="panel">

<video
controls
autoplay
src="${esc(v.video_url)}">
</video>

<h2>${esc(v.title)}</h2>

<div class="meta">
${esc(v.channel||"ZolTube Creator")}
 · ${(v.views||0)+1} views
</div>

<p>
${esc(v.description||"")}
</p>

<div class="row">

<button class="btn secondary">
👍 Like
</button>

<button class="btn secondary">
💬 Comment
</button>

<button class="btn primary">
🔔 Subscribe
</button>

</div>

</div>
`;
}


/* =========================
   CREATOR STUDIO
========================= */

async function studio(el){

nav(el);

if(!me){

loginBox();
return;

}

const mine=
vids.filter(v=>v.user_id===me.id);

const views=
mine.reduce(
(a,v)=>a+(v.views||0),0
);

main.innerHTML=`

<div class="panel">

<h1>📊 Creator Studio</h1>

<p>
Welcome, ${esc(me.name)}
</p>

<div class="stats">

<div class="stat">
Videos
<b>${mine.length}</b>
</div>

<div class="stat">
Views
<b>${views}</b>
</div>

<div class="stat">
Subscribers
<b>0</b>
</div>

</div>

</div>
`;
}


/* =========================
   CHANNEL
========================= */

function channel(el){

nav(el);

if(!me){

loginBox();
return;

}

const mine=
vids.filter(v=>v.user_id===me.id);

main.innerHTML=`

<div class="panel">

<h1>👤 ${esc(me.channel)}</h1>

<p>${esc(me.email)}</p>

<h2>My Videos</h2>

<div class="grid">

${
mine.map(card).join("")
||
"<p>अभी कोई video नहीं है।</p>"
}

</div>

</div>
`;
}


/* =========================
   CLOSE MODAL
========================= */

function closeBox(){

modal.style.display="none";

}


/* =========================
   HTML SAFETY
========================= */

function esc(s){

return String(s??"")
.replace(/[&<>"]/g,c=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;"

}[c]));

}


/* =========================
   START APP
========================= */

supabase.auth.onAuthStateChange(
async()=>{
await loadMe();
render();
}
);

(async()=>{

await loadMe();
await load();

})();

</script>

</body>
  </html>
