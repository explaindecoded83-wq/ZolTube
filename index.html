<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZolTube</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f7f7;
  color:#111;
}
header{
  height:64px;
  background:#fff;
  border-bottom:1px solid #ddd;
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 14px;
  position:sticky;
  top:0;
  z-index:5;
}
.logo{
  font-size:25px;
  font-weight:800;
  color:#e11;
  white-space:nowrap;
}
.logo span{color:#111}

.search{
  flex:1;
  max-width:650px;
  margin:auto;
  display:flex;
}
.search input{
  width:100%;
  padding:12px 16px;
  border:1px solid #bbb;
  border-radius:25px 0 0 25px;
  font-size:16px;
  outline:none;
}
.search button{
  border:1px solid #bbb;
  border-left:0;
  border-radius:0 25px 25px 0;
  padding:0 18px;
  background:#fff;
  font-size:18px;
}
.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:#111;
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:bold;
  cursor:pointer;
}

.layout{display:flex}
.side{
  width:210px;
  background:#fff;
  min-height:calc(100vh - 64px);
  padding:14px 9px;
  position:sticky;
  top:64px;
}
.nav{
  padding:12px;
  border-radius:10px;
  cursor:pointer;
  margin:3px 0;
}
.nav:hover,.nav.active{
  background:#eee;
  font-weight:bold;
}

main{
  flex:1;
  max-width:1250px;
  margin:auto;
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(245px,1fr));
  gap:20px;
}
.card{cursor:pointer}
.thumb{
  aspect-ratio:16/9;
  border-radius:11px;
  background:linear-gradient(135deg,#222,#888);
  display:grid;
  place-items:center;
  color:white;
  font-size:40px;
  overflow:hidden;
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.title{
  font-weight:700;
  margin-top:9px;
}
.meta{
  font-size:13px;
  color:#666;
  margin-top:5px;
}

.panel{
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  padding:20px;
  margin-bottom:18px;
}

.btn{
  padding:10px 16px;
  border:0;
  border-radius:22px;
  cursor:pointer;
  font-size:15px;
}
.primary{
  background:#e11;
  color:#fff;
}
.secondary{
  background:#fff;
  border:1px solid #bbb;
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:20;
  align-items:center;
  justify-content:center;
  padding:18px;
}
.box{
  background:#fff;
  padding:22px;
  border-radius:16px;
  width:100%;
  max-width:520px;
  max-height:90vh;
  overflow:auto;
}
.box input,.box textarea{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #bbb;
  border-radius:8px;
  font-size:15px;
}
.box textarea{
  min-height:100px;
  resize:vertical;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.stat{
  background:#eee;
  padding:16px;
  border-radius:12px;
}
.stat b{
  display:block;
  font-size:25px;
  margin-top:5px;
}

.notice{
  background:#fff8d9;
  border:1px solid #eadb7a;
  padding:13px;
  border-radius:10px;
  margin:10px 0;
}

.empty{
  text-align:center;
  padding:40px 15px;
  color:#666;
}

video{
  width:100%;
  max-height:70vh;
  background:#000;
  border-radius:12px;
}

@media(max-width:750px){
  .side{display:none}
  main{padding:14px}
  .stats{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr}
}

@media(max-width:430px){
  .grid{grid-template-columns:1fr}
  .logo{font-size:22px}
  .search input{font-size:14px}
}
</style>
</head>

<body>

<header>
  <div class="logo">Zol<span>Tube</span></div>

  <div class="search">
    <input
      id="q"
      placeholder="Search ZolTube..."
      oninput="render()"
    >
    <button onclick="render()">🔍</button>
  </div>

  <div class="avatar" id="ava" onclick="accountBox()">Z</div>
</header>

<div class="layout">

<aside class="side">

  <div class="nav active" onclick="home(this)">
    🏠 Home
  </div>

  <div class="nav" onclick="showShorts(this)">
    ⚡ Shorts
  </div>

  <hr>

  <div class="nav" onclick="studio(this)">
    📊 Creator Studio
  </div>

  <div class="nav" onclick="uploadBox()">
    ⬆️ Upload
  </div>

  <div class="nav" onclick="channel(this)">
    👤 My Channel
  </div>

  <div class="nav" onclick="accountBox()">
    🔐 Account
  </div>

</aside>

<main id="main"></main>

</div>

<div class="modal" id="modal">
  <div class="box" id="box"></div>
</div>

<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
"https://yfcvfcokdovppmwldrl.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_XTbCx24neg0ySUi6Ih16hw_ordpBVhf";

const supabase =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =====================================================
   APP DATA
===================================================== */

let vids = [];
let mode = "home";
let me = null;

const main = document.getElementById("main");
const modal = document.getElementById("modal");
const box = document.getElementById("box");
const ava = document.getElementById("ava");


/* =====================================================
   START
===================================================== */

async function start(){

  try{
    const {data:{user}} =
      await supabase.auth.getUser();

    if(user){
      await loadMe();
    }

    await loadVideos();

  }catch(e){

    console.error(e);

    main.innerHTML = `
      <div class="panel">
        <h2>⚠️ ZolTube loading problem</h2>
        <p>Supabase connection check करें।</p>
      </div>
    `;
  }
}


/* =====================================================
   CURRENT USER
===================================================== */

async function loadMe(){

  const {data:{user}} =
    await supabase.auth.getUser();

  if(!user){
    me=null;
    ava.textContent="Z";
    return;
  }

  const {data:profile} =
    await supabase
      .from("profiles")
      .select("*")
      .eq("id",user.id)
      .maybeSingle();

  me = {
    id:user.id,
    email:user.email,
    username:profile?.username || "",
    display_name:
      profile?.display_name ||
      user.email?.split("@")[0] ||
      "User"
  };

  ava.textContent =
    me.display_name
      .charAt(0)
      .toUpperCase();
}


/* =====================================================
   LOAD VIDEOS
===================================================== */

async function loadVideos(){

  const {data,error} =
    await supabase
      .from("videos")
      .select("*")
      .order("created_at",{ascending:false});

  if(error){
    console.error(error);
    vids=[];
  }else{
    vids=data || [];
  }

  render();
}


/* =====================================================
   CARD
===================================================== */

function card(v){

  const title =
    esc(v.title || "Untitled");

  const views =
    Number(v.views || 0);

  const thumb =
    v.thumbnail_url
      ? `<img src="${esc(v.thumbnail_url)}">`
      : "▶";

  return `
    <div class="card"
         onclick='watch(${JSON.stringify(v.id)})'>

      <div class="thumb">
        ${thumb}
      </div>

      <div class="title">
        ${title}
      </div>

      <div class="meta">
        ${views} views
      </div>

    </div>
  `;
}


/* =====================================================
   HOME
===================================================== */

function render(){

  let list=[...vids];

  const q =
    document
      .getElementById("q")
      .value
      .toLowerCase()
      .trim();

  if(mode==="shorts"){
    list=list.filter(v =>
      String(v.title || "")
        .toLowerCase()
        .includes("short")
    );
  }

  if(q){
    list=list.filter(v =>
      (
        String(v.title || "") +
        " " +
        String(v.description || "")
      )
      .toLowerCase()
      .includes(q)
    );
  }

  main.innerHTML=`

    <div class="row" style="margin-bottom:18px">

      <button
        class="btn primary"
        onclick="uploadBox()">
        ⬆️ Upload video
      </button>

      <button
        class="btn secondary"
        onclick="accountBox()">
        ${me ? "My Account" : "Login / Sign up"}
      </button>

    </div>

    ${
      list.length
      ?
      `<div class="grid">
        ${list.map(card).join("")}
      </div>`
      :
      `
      <div class="panel empty">
        <h2>अभी कोई video नहीं है।</h2>
        <p>पहला video upload करें।</p>
      </div>
      `
    }
  `;
}


/* =====================================================
   HOME / SHORTS
===================================================== */

function home(el){

  mode="home";
  nav(el);
  render();
}

function showShorts(el){

  mode="shorts";
  nav(el);
  render();
}

function nav(el){

  document
    .querySelectorAll(".nav")
    .forEach(x =>
      x.classList.remove("active")
    );

  if(el)
    el.classList.add("active");
}


/* =====================================================
   ACCOUNT
===================================================== */

async function accountBox(){

  modal.style.display="flex";

  if(me){

    box.innerHTML=`

      <h2>👤 My Account</h2>

      <div class="panel">

        <b>${esc(me.display_name)}</b>

        <p>${esc(me.email)}</p>

        ${
          me.username
          ? `<p>@${esc(me.username)}</p>`
          : ""
        }

      </div>

      <div class="row">

        <button
          class="btn secondary"
          onclick="channel()">
          My Channel
        </button>

        <button
          class="btn secondary"
          onclick="closeBox()">
          Close
        </button>

        <button
          class="btn primary"
          onclick="logout()">
          Logout
        </button>

      </div>
    `;

    return;
  }

  loginBox();
}


/* =====================================================
   LOGIN / SIGNUP
===================================================== */

function loginBox(){

  modal.style.display="flex";

  box.innerHTML=`

    <h2>🔐 ZolTube Account</h2>

    <input
      id="signupName"
      placeholder="Name (signup के लिए)">

    <input
      id="signupUsername"
      placeholder="Username जैसे zolrao">

    <input
      id="email"
      type="email"
      placeholder="Email">

    <input
      id="password"
      type="password"
      placeholder="Password (6+ characters)">

    <div class="row">

      <button
        class="btn primary"
        onclick="signup()">
        Create account
      </button>

      <button
        class="btn secondary"
        onclick="signin()">
        Login
      </button>

      <button
        class="btn secondary"
        onclick="closeBox()">
        Close
      </button>

    </div>

    <div class="notice">
      अगर email confirmation चालू है,
      तो signup के बाद email verify करना पड़ सकता है।
    </div>
  `;
}


/* =====================================================
   SIGNUP
===================================================== */

async function signup(){

  const name =
    document.getElementById("signupName")
      .value.trim();

  const username =
    document.getElementById("signupUsername")
      .value.trim()
      .toLowerCase()
      .replace(/[^a-z0-9_]/g,"");

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  if(!name || !email || password.length<6){

    alert(
      "Name, email और कम से कम 6 character password डालें।"
    );

    return;
  }

  const {data,error} =
    await supabase.auth.signUp({
      email,
      password
    });

  if(error){

    alert(error.message);
    return;
  }

  if(data.user){

    const {error:profileError} =
      await supabase
        .from("profiles")
        .insert({
          id:data.user.id,
          username:
            username ||
            ("user_" + data.user.id.slice(0,8)),
          display_name:name
        });

    if(profileError){

      console.error(profileError);

      alert(
        "Account बन गया है, लेकिन profile save नहीं हो सकी।"
      );

      return;
    }
  }

  if(data.session){

    await loadMe();
    closeBox();
    render();

    alert("ZolTube account तैयार है! 🎉");

  }else{

    closeBox();

    alert(
      "Account बन गया है। 📧 Email में confirmation link खोलें, फिर ZolTube में Login करें।"
    );
  }
}


/* =====================================================
   LOGIN
===================================================== */

async function signin(){

  const email =
    document.getElementById("email")
      .value.trim();

  const password =
    document.getElementById("password")
      .value;

  const {data,error} =
    await supabase.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    alert(error.message);
    return;
  }

  await loadMe();

  closeBox();
  render();

  alert("Login successful! ✅");
}


/* =====================================================
   LOGOUT
===================================================== */

async function logout(){

  await supabase.auth.signOut();

  me=null;

  ava.textContent="Z";

  closeBox();

  render();
}


/* =====================================================
   UPLOAD
===================================================== */

function uploadBox(){

  if(!me){

    loginBox();

    return;
  }

  modal.style.display="flex";

  box.innerHTML=`

    <h2>⬆️ Upload Video</h2>

    <input
      id="videoTitle"
      placeholder="Video title">

    <textarea
      id="videoDescription"
      placeholder="Description"></textarea>

    <input
      id="videoFile"
      type="file"
      accept="video/*">

    <div class="notice">
      Maximum file size: 50 MB
    </div>

    <div class="row">

      <button
        class="btn primary"
        onclick="publish()">
        Publish
      </button>

      <button
        class="btn secondary"
        onclick="closeBox()">
        Cancel
      </button>

    </div>

    <p id="uploadStatus"></p>
  `;
}


/* =====================================================
   PUBLISH
===================================================== */

async function publish(){

  const title =
    document.getElementById("videoTitle")
      .value.trim();

  const description =
    document.getElementById("videoDescription")
      .value.trim();

  const file =
    document.getElementById("videoFile")
      .files[0];

  const status =
    document.getElementById("uploadStatus");

  if(!title){

    alert("Video title डालें।");
    return;
  }

  if(!file){

    alert("Video file चुनें।");
    return;
  }

  if(file.size > 50 * 1024 * 1024){

    alert(
      "Video 50 MB से छोटा होना चाहिए।"
    );

    return;
  }

  status.textContent =
    "Video upload हो रहा है... कृपया wait करें।";

  const safeName =
    file.name
      .replace(/[^a-zA-Z0-9._-]/g,"_");

  const filePath =
    me.id +
    "/" +
    Date.now() +
    "-" +
    safeName;

  try{

    const {error:uploadError} =
      await supabase
        .storage
        .from("videos")
        .upload(
          filePath,
          file,
          {
            cacheControl:"3600",
            upsert:false,
            contentType:file.type
          }
        );

    if(uploadError)
      throw uploadError;


    const {data:urlData} =
      supabase
        .storage
        .from("videos")
        .getPublicUrl(filePath);

    const videoUrl =
      urlData.publicUrl;


    const {error:dbError} =
      await supabase
        .from("videos")
        .insert({
          user_id:me.id,
          title:title,
          description:description,
          video_url:videoUrl,
          thumbnail_url:null
        });

    if(dbError){

      await supabase
        .storage
        .from("videos")
        .remove([filePath]);

      throw dbError;
    }

    status.textContent =
      "Upload complete! ✅";

    await loadVideos();

    setTimeout(
      closeBox,
      700
    );

  }catch(error){

    console.error(error);

    status.textContent =
      "Upload failed ❌";

    alert(
      error.message ||
      "Video upload नहीं हो पाया।"
    );
  }
}


/* =====================================================
   WATCH VIDEO
===================================================== */

async function watch(id){

  const v =
    vids.find(x => x.id === id);

  if(!v)
    return;

  await supabase
    .rpc(
      "increment_video_views",
      {
        p_video_id:id
      }
    )
    .catch(e =>
      console.error(e)
    );

  v.views =
    Number(v.views || 0) + 1;

  main.innerHTML=`

    <div class="panel">

      <video
        controls
        playsinline
        src="${esc(v.video_url || "")}">
      </video>

      <h2>
        ${esc(v.title || "Untitled")}
      </h2>

      <div class="meta">
        ${Number(v.views || 0)} views
      </div>

      <p>
        ${esc(v.description || "")}
      </p>

      <div class="row">

        <button
          class="btn secondary"
          onclick="render()">
          ← Back
        </button>

      </div>

    </div>
  `;
}


/* =====================================================
   CREATOR STUDIO
===================================================== */

function studio(el){

  nav(el);

  if(!me){

    loginBox();
    return;
  }

  const mine =
    vids.filter(v =>
      v.user_id === me.id
    );

  const views =
    mine.reduce(
      (a,v) =>
        a + Number(v.views || 0),
      0
    );

  main.innerHTML=`

    <div class="panel">

      <h1>📊 Creator Studio</h1>

      <p>
        Welcome, ${esc(me.display_name)}
      </p>

      <div class="stats">

        <div class="stat">
          Videos
          <b>${mine.length}</b>
        </div>

        <div class="stat">
          Views
          <b>${views}</b>
        </div>

        <div class="stat">
          Subscribers
          <b>0</b>
        </div>

      </div>

    </div>

    <div class="panel">

      <h2>My Videos</h2>

      ${
        mine.length
        ?
        `<div class="grid">
          ${mine.map(card).join("")}
        </div>`
        :
        `<div class="empty">
          अभी कोई video नहीं है।
        </div>`
      }

    </div>
  `;
}


/* =====================================================
   CHANNEL
===================================================== */

async function channel(el){

  if(el)
    nav(el);

  if(!me){

    loginBox();
    return;
  }

  const mine =
    vids.filter(v =>
      v.user_id === me.id
    );

  main.innerHTML=`

    <div class="panel">

      <h1>
        👤 ${esc(me.display_name)}
      </h1>

      <p>
        @${esc(me.username || "user")}
      </p>

      <p>
        ${esc(me.email)}
      </p>

    </div>

    <div class="panel">

      <h2>My Videos</h2>

      ${
        mine.length
        ?
        `<div class="grid">
          ${mine.map(card).join("")}
        </div>`
        :
        `<div class="empty">
          अभी कोई video नहीं है।
        </div>`
      }

    </div>
  `;
}


/* =====================================================
   CLOSE MODAL
===================================================== */

function closeBox(){

  modal.style.display="none";
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function esc(s){

  return String(s ?? "")
    .replace(
      /[&<>"]/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;"
      }[c])
    );
}


/* =====================================================
   AUTH STATE
===================================================== */

supabase.auth.onAuthStateChange(
  async (event,session)=>{

    if(session){

      await loadMe();

    }else{

      me=null;
      ava.textContent="Z";
    }
